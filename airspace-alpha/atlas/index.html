<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122722"><title>The Newark Turn · Airspace Alpha Atlas</title><link rel="stylesheet" href="style.css"><script defer src="recorded.js"></script><script defer src="data.js"></script><script defer src="engine.js"></script><script defer src="app.js"></script></head>
<body><header><a class="brand" href="./" aria-label="Airspace Alpha home"><i aria-hidden="true">✦</i><span>Airspace Alpha</span></a><nav aria-label="Workspace"><button id="atlasTab">Atlas</button><button id="replayTab" class="current">Replay</button></nav><button class="sources" id="sourceBtn"><span aria-hidden="true">▤</span> Field notes</button></header>
<main><section class="scene" aria-label="Illustrated Newark Liberty airport board"><div id="board"><div class="landscape"></div><button class="pin hub" id="hub"><b>EWR</b><span>Newark Liberty</span></button><button class="pin runway" id="runway">04L / 22R</button><button class="pin plane" id="plane" aria-label="Inspect aircraft rotation">✈ <span>Aircraft</span></button></div>
